name: Release

# Pushing a version tag ("0.2.0", made by `npm version`) builds the plugin,
# attests the two files Obsidian downloads, and opens a draft GitHub release
# with them.
on:
  push:
    tags: ['*']

permissions:
  contents: write # create the release
  id-token: write # get a short-lived signing certificate for the attestation
  attestations: write # store the attestation on this repository
  artifact-metadata: write # record the attested files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      # A signed record of each file's SHA-256, the commit and this workflow,
      # which `gh attestation verify` checks a download against.
      - name: Attest the release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" main.js manifest.json
          --draft --title "$GITHUB_REF_NAME" --generate-notes

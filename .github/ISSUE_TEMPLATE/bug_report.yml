name: Bug report
description: Something does not work as the README says it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note in reading view
        2. Select a paragraph
        3. Ask Claude Code "what does this mean?"
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: State file
      description: >-
        The contents of ~/.claude/obsidian-context/state.json at the time, if it exists.
        It contains note paths and the text you selected, so remove anything private first.
      render: json
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version
      placeholder: "1.14.4"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Windows 11, Arch Linux...
    validations:
      required: true
